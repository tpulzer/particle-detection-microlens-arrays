# =========================================================
# Synthetic Particle Dataset Generation Configuration
# =========================================================

general:
  image_size: 512
  num_samples: 100

# =========================================================
# Particle Settings
# =========================================================

particles:
  count_range: [0, 20]
  radius_range: [2, 10]

  intensity_range: [0.0, 0.8]

  type_weights:
    circle: 0.02
    fiber: 0.20
    spline: 0.15
    freeform: 0.50

# =========================================================
# Image Effects
# =========================================================

effects:
  blur_sigma_range: [0.5, 1.5]
  noise_sigma_range: [0.0, 0.1]

# =========================================================
# Background Structure
# =========================================================

background:
  structure_type: "fresnel_array"

  # Line pattern
  line:
    period: 16
    width: 6

  # Ring pattern
  ring:
    period: 24
    width: 2.0
    log_scale: 1.5

  # Fresnel pattern
  fresnel:
    scale: 8.0
    width: 4.0

  # Fresnel array
  array:
    pitch: 320

# =========================================================
# Illumination
# =========================================================

illumination:
  type: "both"   # linear | radial | both | none

  strength_range: [0.5, 1.2]

  noise: 0.02

  clamp: true

  gamma_correction: true
  gamma_range: [0.9, 1.1]